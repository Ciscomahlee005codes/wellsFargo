<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- phone Input  -->

</head>
<body>
  <div class="header">
    <div class="logos">
     <h1 class="logo-text">WellsFargo Banking Ltd.</h1>
    </div>
 </div>
    <div class="container" id="signup" style="display:none;">
      <h1 class="form-title">Register</h1>
      <form method="post" action="" id="registrationForm">
        <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
        <div class="input-group">
           <i class="fas fa-user"></i>
           <input type="text"  id="fName" placeholder="First Name" required>
           <label for="fname">First Name</label>
        </div>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text"  id="lName" placeholder="Last Name" required>
            <label for="lName">Last Name</label>
        </div>
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email"  id="rEmail" placeholder="Email" required>
            <label for="rEmail">Email</label>
        </div>
        <div class="input-group">
          <input type="tel" id="phone" placeholder="Mobile Number" required>
          <label for="phone">Mobile Number</label>
        </div>

      <div class="input-group">
        <i class="fas fa-home"></i>
        <input type="text"  id="address" placeholder="Address" required>
        <label for="address">Address</label>
    </div>

    <div class="input-group">
      <i class="fas fa-map-marker-alt"></i>
      <input type="text"  id="postalCode" placeholder="Postal Code" required>
      <label for="code">Postal Code</label>
  </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="rPassword"  placeholder="Password" required>
            <label for="rPassword">Password</label>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirmPassword"  placeholder="Password" required>
          <label for="rPassword">Confirm Password</label>
      </div>
       <button class="btn" id="submitSignUp" type="submit">Sign Up</button>
      </form>
      <p class="or">
        ----------or--------
      </p>
      <div class="links">
        <p id="affirm-1">Already Have Account ?</p>
        <button id="signInButton" type="button">Sign In</button>
      </div>
    </div>

  <div class="container" id="signIn">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="" id="signInForm">
          <div id="signInMessage" class="messageDiv" style="display:none;"></div>

          <div class="input-group">
              <i class="fas fa-envelope"></i>
              <input type="email"  id="email" placeholder="Email" required>
              <label for="email">Email</label>
          </div>
          <div class="input-group">
              <i class="fas fa-lock"></i>
            <input type="password" id="password"  placeholder="Password" required>
              <label for="password">Password</label>
          </div>
          <p class="recover">
            <a href="#">Recover Password</a>
          </p>
         <button  class="btn"  id="submitSignIn" type="submit">Sign In</button>
        </form>
        <p class="or">
          ----------or--------
        </p>
        <div class="links">
          <p id="affirm-2">Don't have account yet?</p>
          <button id="signUpButton" type="submit">Sign Up</button>
        </div>
      </div>

</body>
</html>
